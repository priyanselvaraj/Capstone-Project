<rect width="100%" height="100%" fill="white"/>
<text x="40" y="45" font-size="28">Supplier Performance Rating System - ER Diagram</text>
<text x="40" y="80" font-size="16">PK = Primary Key, FK = Foreign Key</text>
<rect x="50" y="120" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="62" y="148" font-size="18" font-weight="bold">USERS</text><text x="62" y="178" font-size="14">PK id | username | password | role</text><rect x="420" y="120" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="432" y="148" font-size="18" font-weight="bold">SUPPLIERS</text><text x="432" y="178" font-size="14">PK id | supplier_code | name | email</text><rect x="800" y="120" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="812" y="148" font-size="18" font-weight="bold">PRODUCTS</text><text x="812" y="178" font-size="14">PK id | product_code | name | category</text><rect x="250" y="330" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="262" y="358" font-size="18" font-weight="bold">PURCHASE_ORDERS</text><text x="262" y="388" font-size="14">PK id | order_number | FK supplier_id | total_amount</text><rect x="650" y="330" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="662" y="358" font-size="18" font-weight="bold">ORDER_ITEMS</text><text x="662" y="388" font-size="14">PK id | FK order_id | FK product_id | quantity</text><rect x="950" y="330" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="962" y="358" font-size="18" font-weight="bold">DELIVERIES</text><text x="962" y="388" font-size="14">PK id | FK order_id | expected_date | actual_date</text><rect x="250" y="560" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="262" y="588" font-size="18" font-weight="bold">SUPPLIER_RATINGS</text><text x="262" y="618" font-size="14">PK id | FK supplier_id | scores | overall_score</text><rect x="700" y="560" width="300" height="105" fill="white" stroke="black" stroke-width="2"/><text x="712" y="588" font-size="18" font-weight="bold">FEEDBACK</text><text x="712" y="618" font-size="14">PK id | FK supplier_id | FK user_id | comments</text><line x1="350" y1="170" x2="420" y2="170" stroke="black" stroke-width="2"/><line x1="570" y1="225" x2="400" y2="330" stroke="black" stroke-width="2"/><line x1="570" y1="225" x2="800" y2="170" stroke="black" stroke-width="2"/><line x1="550" y1="435" x2="650" y2="380" stroke="black" stroke-width="2"/><line x1="700" y1="435" x2="950" y2="380" stroke="black" stroke-width="2"/><line x1="400" y1="435" x2="400" y2="560" stroke="black" stroke-width="2"/><line x1="570" y1="225" x2="400" y2="560" stroke="black" stroke-width="2"/><line x1="570" y1="225" x2="700" y2="560" stroke="black" stroke-width="2"/><line x1="200" y1="225" x2="700" y2="560" stroke="black" stroke-width="2"/></svg>