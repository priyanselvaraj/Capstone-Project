<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPRS - Login</title><link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="brand"><span>SP</span><div><h1>Supplier Performance</h1><p>Rating System</p></div></div>
  <div class="auth-tabs">
    <a class="auth-tab active" href="index.html">Login</a>
    <a class="auth-tab" href="register.html">Register</a>
  </div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" required autocomplete="username" placeholder="Enter username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password" placeholder="Enter password">
    <button class="btn primary" type="submit">Login</button>
  </form>
  <p class="demo">Demo: <b>admin</b> / <b>admin123</b></p>
  <p class="auth-switch">New user? <a href="register.html">Create an account</a></p>
</div>
<script src="script.js"></script>
</body></html>
